services:
  app:
    build: ./docker/php
    container_name: timelog
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - timelog-network

  db:
    image: mariadb:10.6
    container_name: timelogDb
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3307:3306"  # Host port 3307 → Container port 3306
    networks:
      - timelog-network

  phpmyadmin:
    image: phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    networks:
      - timelog-network
    depends_on:
      - db

volumes:
  dbdata:

networks:
  timelog-network:
    driver: bridge
